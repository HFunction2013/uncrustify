name: build-uncrustify-wasm
on:
  push:
    tags: ['b*']
  pull_request:
    branches: [master]

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten 3.1.60
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.60
          actions-cache-folder: emsdk-cache

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 nodejs npm

      - name: Check emcc version
        run: emcc --version

      - name: Run WASM build script
        run: |
          chmod +x ./build_wasm.sh
          ./build_wasm.sh

      - name: Collect artifacts
        run: |
          ls -la ./dist
          cp emscripten/libUncrustify.d.ts ./dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uncrustify-wasm
          path: dist